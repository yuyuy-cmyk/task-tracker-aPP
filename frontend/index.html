<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #162033;
      --muted: #687386;
      --line: #dfe5ee;
      --paper: #ffffff;
      --canvas: #f4f6fa;
      --accent: #6157d9;
      --accent-dark: #4a41b9;
      --danger: #c43d4f;
      --shadow: 0 12px 34px rgba(36, 44, 78, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(97, 87, 217, 0.12), transparent 34rem),
        var(--canvas);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1440px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 48px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 4vw, 3.2rem); letter-spacing: -0.05em; }
    .subtitle { margin: 8px 0 0; color: var(--muted); }
    .primary, .secondary, .icon-button {
      border: 0;
      border-radius: 12px;
      transition: 160ms ease;
    }
    .primary { padding: 12px 18px; color: white; background: var(--accent); font-weight: 750; box-shadow: 0 8px 18px rgba(97, 87, 217, 0.24); }
    .primary:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .secondary { padding: 10px 14px; color: var(--ink); background: #eef0f7; font-weight: 700; }
    .secondary:hover { background: #e4e7f0; }
    .danger { color: var(--danger); }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr)) auto;
      gap: 12px;
      align-items: end;
      padding: 16px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(223, 229, 238, 0.9);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 0.82rem; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--ink);
      background: white;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(97, 87, 217, 0.13); }

    .notice { min-height: 24px; margin: 0 0 12px; color: var(--muted); }
    .notice.error { color: var(--danger); font-weight: 700; }
    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .column {
      min-height: 420px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(242, 244, 248, 0.8);
    }
    .column.drag-over { border-color: var(--accent); background: rgba(97, 87, 217, 0.08); }
    .column-header { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 14px; }
    .column-header h2 { margin: 0; font-size: 1rem; }
    .count { display: grid; place-items: center; min-width: 28px; height: 28px; padding: 0 7px; border-radius: 99px; background: white; color: var(--muted); font-weight: 800; }
    .cards { display: grid; gap: 12px; }
    .empty { padding: 42px 14px; color: #8b94a5; text-align: center; border: 1px dashed #cbd2dd; border-radius: 14px; }
    .card {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--paper);
      box-shadow: 0 6px 18px rgba(36, 44, 78, 0.07);
    }
    .card[draggable="true"] { cursor: grab; }
    .card.dragging { opacity: 0.45; }
    .card-top { display: flex; justify-content: space-between; gap: 10px; }
    .card h3 { margin: 0; font-size: 1rem; line-height: 1.35; }
    .card p { margin: 9px 0 0; color: var(--muted); line-height: 1.45; white-space: pre-wrap; }
    .priority { flex: none; padding: 4px 8px; border-radius: 99px; font-size: 0.68rem; font-weight: 850; text-transform: uppercase; }
    .priority-high { color: #a82b41; background: #fde7eb; }
    .priority-medium { color: #8b5c0b; background: #fff1cf; }
    .priority-low { color: #216e52; background: #dff5eb; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; color: var(--muted); font-size: 0.78rem; }
    .pill, .tag { padding: 4px 8px; border-radius: 99px; background: #f0f2f7; }
    .tag { color: #4f46ad; background: #eceafd; }
    .overdue { color: #a82b41; background: #fde7eb; font-weight: 800; }
    .card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .card-actions button { padding: 7px 10px; border: 0; border-radius: 8px; background: #f0f2f7; color: var(--ink); font-weight: 700; }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center; padding: 20px;
      background: rgba(18, 24, 39, 0.56);
    }
    .modal-backdrop[hidden] { display: none; }
    .modal { width: min(660px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 22px; border-radius: 20px; background: white; box-shadow: 0 24px 80px rgba(10, 14, 27, 0.25); }
    .modal-header, .modal-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .modal h2 { margin: 0; }
    .icon-button { width: 38px; height: 38px; color: var(--muted); background: #f0f2f7; font-size: 1.25rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .full { grid-column: 1 / -1; }
    textarea { min-height: 92px; resize: vertical; }
    .form-error { min-height: 22px; margin: 12px 0 0; color: var(--danger); font-weight: 700; }
    .modal-actions { justify-content: flex-end; margin-top: 18px; }

    @media (max-width: 900px) {
      .filters { grid-template-columns: 1fr 1fr; }
      .board { grid-template-columns: 1fr; }
      .column { min-height: 180px; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 20px, 1440px); padding-top: 20px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .filters, .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">AI-Assisted Coding Project</p>
        <h1>Task Tracker</h1>
        <p class="subtitle">Plan work, track deadlines, and keep priorities visible.</p>
      </div>
      <button class="primary" id="new-task-button" type="button">+ New task</button>
    </header>

    <section class="filters" aria-label="Task filters">
      <label>Status
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="ToDo">To Do</option>
          <option value="InProgress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </label>
      <label>Priority
        <select id="priority-filter">
          <option value="">All priorities</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </label>
      <label>Tag
        <input id="tag-filter" type="search" placeholder="e.g. backend">
      </label>
      <label>Deadline
        <select id="overdue-filter">
          <option value="">All tasks</option>
          <option value="true">Overdue only</option>
          <option value="false">Not overdue</option>
        </select>
      </label>
      <button class="secondary" id="clear-filters" type="button">Clear</button>
    </section>

    <p class="notice" id="notice" role="status" aria-live="polite">Loading tasks…</p>

    <section class="board" aria-label="Kanban board">
      <article class="column" data-status="ToDo">
        <header class="column-header"><h2>To Do</h2><span class="count" id="count-ToDo">0</span></header>
        <div class="cards" id="cards-ToDo"></div>
      </article>
      <article class="column" data-status="InProgress">
        <header class="column-header"><h2>In Progress</h2><span class="count" id="count-InProgress">0</span></header>
        <div class="cards" id="cards-InProgress"></div>
      </article>
      <article class="column" data-status="Done">
        <header class="column-header"><h2>Done</h2><span class="count" id="count-Done">0</span></header>
        <div class="cards" id="cards-Done"></div>
      </article>
    </section>
  </main>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <h2 id="modal-title">New task</h2>
        <button class="icon-button" id="close-modal" type="button" aria-label="Close">×</button>
      </header>
      <form id="task-form">
        <input id="task-id" type="hidden">
        <div class="form-grid">
          <label class="full">Title
            <input id="task-title" maxlength="200" required>
          </label>
          <label class="full">Description
            <textarea id="task-description"></textarea>
          </label>
          <label>Status
            <select id="task-status">
              <option value="ToDo">To Do</option>
              <option value="InProgress">In Progress</option>
              <option value="Done">Done</option>
            </select>
          </label>
          <label>Priority
            <select id="task-priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </label>
          <label>Assignee
            <input id="task-assignee" placeholder="Optional">
          </label>
          <label>Due date
            <input id="task-due-date" type="date">
          </label>
          <label class="full">Tags
            <input id="task-tags" placeholder="backend, urgent (maximum 10)">
          </label>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <footer class="modal-actions">
          <button class="secondary danger" id="delete-task" type="button" hidden>Delete</button>
          <button class="secondary" id="cancel-modal" type="button">Cancel</button>
          <button class="primary" type="submit">Save task</button>
        </footer>
      </form>
    </section>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";
    const STATUSES = ["ToDo", "InProgress", "Done"];
    const PRIORITY_ORDER = { High: 0, Medium: 1, Low: 2 };
    let tasks = [];
    let draggedTaskId = null;

    const notice = document.querySelector("#notice");
    const backdrop = document.querySelector("#modal-backdrop");
    const form = document.querySelector("#task-form");
    const formError = document.querySelector("#form-error");

    function setNotice(message, isError = false) {
      notice.className = isError ? "notice error" : "notice";
      notice.textContent = message;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[character]);
    }

    function queryString() {
      const params = new URLSearchParams();
      const values = {
        status: document.querySelector("#status-filter").value,
        priority: document.querySelector("#priority-filter").value,
        tag: document.querySelector("#tag-filter").value.trim(),
        overdue: document.querySelector("#overdue-filter").value
      };
      Object.entries(values).forEach(([key, value]) => value && params.set(key, value));
      return params.toString() ? `?${params}` : "";
    }

    async function apiRequest(path, options = {}) {
      const response = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      if (!response.ok) {
        let message = `Request failed (${response.status})`;
        try {
          const body = await response.json();
          message = typeof body.detail === "string" ? body.detail : message;
        } catch (_) {}
        throw new Error(message);
      }
      return response.status === 204 ? null : response.json();
    }

    async function fetchTasks() {
      setNotice("Loading tasks…");
      try {
        tasks = await apiRequest(`/tasks${queryString()}`);
        renderBoard();
        setNotice(`${tasks.length} task${tasks.length === 1 ? "" : "s"} shown`);
      } catch (error) {
        tasks = [];
        renderBoard();
        setNotice(`Could not load tasks: ${error.message}`, true);
      }
    }

    function taskCard(task) {
      const tags = task.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
      const due = task.due_date
        ? `<span class="pill ${task.is_overdue ? "overdue" : ""}">${task.is_overdue ? "Overdue · " : "Due · "}${escapeHtml(task.due_date)}</span>`
        : "";
      const assignee = task.assignee ? `<span class="pill">👤 ${escapeHtml(task.assignee)}</span>` : "";
      return `
        <article class="card" draggable="true" data-id="${escapeHtml(task.id)}">
          <div class="card-top">
            <h3>${escapeHtml(task.title)}</h3>
            <span class="priority priority-${task.priority.toLowerCase()}">${escapeHtml(task.priority)}</span>
          </div>
          ${task.description ? `<p>${escapeHtml(task.description)}</p>` : ""}
          <div class="meta">${due}${assignee}${tags}</div>
          <div class="card-actions">
            <button type="button" data-action="edit" data-id="${escapeHtml(task.id)}">Edit</button>
          </div>
        </article>`;
    }

    function renderBoard() {
      STATUSES.forEach(status => {
        const matching = tasks
          .filter(task => task.status === status)
          .sort((a, b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]
            || a.created_at.localeCompare(b.created_at));
        document.querySelector(`#count-${status}`).textContent = matching.length;
        document.querySelector(`#cards-${status}`).innerHTML = matching.length
          ? matching.map(taskCard).join("")
          : '<div class="empty">No tasks here</div>';
      });
    }

    function resetForm() {
      form.reset();
      document.querySelector("#task-id").value = "";
      document.querySelector("#task-status").value = "ToDo";
      document.querySelector("#task-priority").value = "Medium";
      document.querySelector("#modal-title").textContent = "New task";
      document.querySelector("#delete-task").hidden = true;
      formError.textContent = "";
    }

    function openCreateModal() {
      resetForm();
      backdrop.hidden = false;
      document.querySelector("#task-title").focus();
    }

    function openEditModal(taskId) {
      const task = tasks.find(item => item.id === taskId);
      if (!task) return;
      resetForm();
      document.querySelector("#task-id").value = task.id;
      document.querySelector("#task-title").value = task.title;
      document.querySelector("#task-description").value = task.description;
      document.querySelector("#task-status").value = task.status;
      document.querySelector("#task-priority").value = task.priority;
      document.querySelector("#task-assignee").value = task.assignee || "";
      document.querySelector("#task-due-date").value = task.due_date || "";
      document.querySelector("#task-tags").value = task.tags.join(", ");
      document.querySelector("#modal-title").textContent = "Edit task";
      document.querySelector("#delete-task").hidden = false;
      backdrop.hidden = false;
      document.querySelector("#task-title").focus();
    }

    function closeModal() {
      backdrop.hidden = true;
      resetForm();
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      formError.textContent = "";
      const title = document.querySelector("#task-title").value.trim();
      if (!title) {
        formError.textContent = "Title must not be empty.";
        return;
      }
      const taskId = document.querySelector("#task-id").value;
      const payload = {
        title,
        description: document.querySelector("#task-description").value,
        status: document.querySelector("#task-status").value,
        priority: document.querySelector("#task-priority").value,
        assignee: document.querySelector("#task-assignee").value.trim() || null,
        due_date: document.querySelector("#task-due-date").value || null,
        tags: document.querySelector("#task-tags").value.split(",").map(tag => tag.trim()).filter(Boolean)
      };
      try {
        await apiRequest(taskId ? `/tasks/${taskId}` : "/tasks", {
          method: taskId ? "PATCH" : "POST",
          body: JSON.stringify(payload)
        });
        closeModal();
        await fetchTasks();
      } catch (error) {
        formError.textContent = error.message;
      }
    });

    document.querySelector("#delete-task").addEventListener("click", async () => {
      const taskId = document.querySelector("#task-id").value;
      if (!taskId || !window.confirm("Delete this task?")) return;
      try {
        await apiRequest(`/tasks/${taskId}`, { method: "DELETE" });
        closeModal();
        await fetchTasks();
      } catch (error) {
        formError.textContent = error.message;
      }
    });

    document.querySelector(".board").addEventListener("click", event => {
      const button = event.target.closest("[data-action='edit']");
      if (button) openEditModal(button.dataset.id);
    });

    document.querySelector(".board").addEventListener("dragstart", event => {
      const card = event.target.closest(".card");
      if (!card) return;
      draggedTaskId = card.dataset.id;
      card.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
    });

    document.querySelector(".board").addEventListener("dragend", event => {
      event.target.closest(".card")?.classList.remove("dragging");
      document.querySelectorAll(".column").forEach(column => column.classList.remove("drag-over"));
      draggedTaskId = null;
    });

    document.querySelectorAll(".column").forEach(column => {
      column.addEventListener("dragover", event => {
        event.preventDefault();
        column.classList.add("drag-over");
      });
      column.addEventListener("dragleave", () => column.classList.remove("drag-over"));
      column.addEventListener("drop", async event => {
        event.preventDefault();
        column.classList.remove("drag-over");
        const task = tasks.find(item => item.id === draggedTaskId);
        const newStatus = column.dataset.status;
        if (!task || task.status === newStatus) return;
        try {
          await apiRequest(`/tasks/${task.id}`, {
            method: "PATCH",
            body: JSON.stringify({ status: newStatus })
          });
          await fetchTasks();
        } catch (error) {
          setNotice(`Move rejected: ${error.message}`, true);
          await fetchTasks();
        }
      });
    });

    document.querySelector("#new-task-button").addEventListener("click", openCreateModal);
    document.querySelector("#close-modal").addEventListener("click", closeModal);
    document.querySelector("#cancel-modal").addEventListener("click", closeModal);
    backdrop.addEventListener("click", event => { if (event.target === backdrop) closeModal(); });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !backdrop.hidden) closeModal();
    });
    ["#status-filter", "#priority-filter", "#overdue-filter"].forEach(selector => {
      document.querySelector(selector).addEventListener("change", fetchTasks);
    });
    document.querySelector("#tag-filter").addEventListener("change", fetchTasks);
    document.querySelector("#clear-filters").addEventListener("click", () => {
      document.querySelectorAll(".filters select, .filters input").forEach(control => { control.value = ""; });
      fetchTasks();
    });

    fetchTasks();
  </script>
</body>
</html>
